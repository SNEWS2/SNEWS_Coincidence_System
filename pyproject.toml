[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snews-cs"
version = "3.0.1"
description = "An coincidence server application for raising supernova alerts."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
authors = [
    { name = "SNEWS Collaboration", email = "snews2.0@lists.bnl.gov" },
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "click>=8.1.7,<9.0.0",
    "hop-client>=0.10.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.1,<3.0.0",
    "python-dotenv>=0.21.1,<0.22.0",
    "slack-sdk>=3.26.2,<4.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "sqlalchemy>=2.0.32,<3.0.0",
    "snews-data-formats>=1.0.0,<2.0.0",
    "snews-pt>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "autopep8>=2.0.4,<3.0.0",
    "flake8>=6.1.0,<7.0.0",
    "pytest<6.3.0",
    "black>=25.1.0,<26.0.0",
]
docs = [
    "sphinx<5",
    "sphinx-pdj-theme>=0.4.0,<0.5.0",
]

[project.scripts]
snews_cs = "snews_cs.__main__:main"

[project.urls]
homepage = "https://snews2.org"
repository = "https://github.com/SNEWS2/SNEWS_Coincidence_System.git"
documentation = "https://snews-coincidence-system.readthedocs.io/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["snews_cs*"]
